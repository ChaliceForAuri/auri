name: Release

# Publishes @aurilabs/core and @aurilabs/ops to npm when a v* tag is pushed,
# via npm Trusted Publishing (OIDC). No token lives in this repo: npmjs.com is
# configured to trust this exact workflow, and npm generates provenance
# attestations automatically. Both packages version in lockstep with the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The full CI gate must pass before anything reaches the registry.
      - run: npm run lint
      - run: npm test
      - run: npm run check --workspaces --if-present
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:browser -w @aurilabs/ops

      # core first — ops depends on it.
      - run: npm publish -w @aurilabs/core
      # prepublishOnly runs svelte-package + publint.
      - run: npm publish -w @aurilabs/ops
