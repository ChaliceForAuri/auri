name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Runners have hung for hours at the apt step of playwright install;
    # a hang should fail fast and get retried, not burn the 6h job limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run check --workspaces --if-present

      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - run: npm run test:browser -w @aurilabs/ops

      # A PR must not be able to break the Pages deploy.
      - run: npm run build -w @aurilabs/docs
