name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Runners have hung for hours at the apt step of playwright install;
    # a hang should fail fast and get retried, not burn the 6h job limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      # tokens.css is generated from tokens.json — fail if someone hand-edited it.
      - run: npm run check:tokens -w @aurilabs/core
      # Same for every catalog.json: authored in catalog.source.json, compiled to the
      # v1.0-conformant artifact. The compiler also refuses to $ref a spec type our
      # local def does not structurally match, so this step is the conformance gate.
      - run: npm run check:catalog --workspaces --if-present

      - run: npm test

      - run: npm run check --workspaces --if-present

      # No --with-deps: the runner image has chromium's real system deps, and
      # the apt step only fetched optional CJK fonts from a mirror that hangs.
      # The browser itself comes from Playwright's CDN and is cached below.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 5

      - run: npm run test:browser -w @aurilabs/ops

      # A PR must not be able to break the Pages deploy.
      - run: npm run build -w @aurilabs/docs
