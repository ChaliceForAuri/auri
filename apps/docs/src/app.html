<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Theme class before first paint — no flash. Keys off the same
			// `.a2ui-dark` class as the renderer theme and the auri tokens.
			try {
				const stored = localStorage.getItem('auri-theme');
				if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('a2ui-dark');
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
