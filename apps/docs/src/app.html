<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
		<meta property="og:site_name" content="auri" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://chaliceforauri.github.io/auri/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			// Theme class before first paint — no flash. Keys off the same
			// `.a2ui-dark` class as the renderer theme and the auri tokens.
			try {
				const stored = localStorage.getItem('auri-theme');
				const el = document.documentElement;
				if (stored === 'dark') el.classList.add('a2ui-dark');
				else if (stored === 'light') el.classList.add('a2ui-light');
				else if (matchMedia('(prefers-color-scheme: dark)').matches) el.classList.add('a2ui-dark');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
